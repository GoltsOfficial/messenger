services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://messenger:messenger@postgres:5432/messenger
      TEST_DATABASE_URL: postgresql+psycopg://messenger:messenger@postgres:5432/messenger_test
    env_file: .env
    ports:
      - '9000:9000'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD', 'pg_isready', '-U', 'tasklist' ]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  postgres_data: